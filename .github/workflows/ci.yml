name: Verify FreightQuote Lite
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-build:
    # Only the existing public standard runner; never opt into a paid/private runner.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests and build distributable
        run: npm run check
      - name: Install ephemeral browser QA dependency only
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run existing calculator and product browser acceptance
        env:
          BROWSER_CHANNEL: chromium
        run: |
          npm run test:e2e
          npm run test:products
